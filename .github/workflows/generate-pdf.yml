name: Generate setlist PDF

on:
  push:
    branches: [main]
    paths:
      - "songs.csv"
      - "config.json"
      - "scripts/generate_pdf.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - run: uv run scripts/generate_pdf.py

      - name: Create release with PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: pdf-${{ github.run_number }}
          name: Setlist ${{ github.run_number }}
          files: setlist.pdf
